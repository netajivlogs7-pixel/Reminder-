name: Build and Release Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.0-run${{ github.run_number }}-attempt${{ github.run_attempt }}"
          RELEASE_TITLE="Build #${{ github.run_number }} (Attempt ${{ github.run_attempt }})"
          gh release create "$TAG_NAME" "app/build/outputs/apk/debug/app-debug.apk" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "Automated debug APK build from commit ${{ github.sha }}." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.0-run${{ github.run_number }}-attempt${{ github.run_attempt }}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Confirming release with gh release view..."
            gh release view "$TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            RELEASE_TITLE=$(gh release view "$TAG_NAME" --json name -q .name)
            echo "Release tag: $TAG_NAME"
            echo "Release title: $RELEASE_TITLE"
            echo "Direct GitHub Release page URL: $RELEASE_URL"
            echo "Exact APK asset filename: app-debug.apk"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
## 🚀 APK Build & Release Succeeded!

- **Release Tag:** \`$TAG_NAME\`
- **Release Title:** $RELEASE_TITLE
- **Direct Release URL:** [$RELEASE_URL]($RELEASE_URL)
- **APK Asset Filename:** \`app-debug.apk\`

### How to Download
You can download the APK directly under the **Assets** section of the GitHub Release page:
👉 **[Download APK from GitHub Release]($RELEASE_URL)**

> **Note:** The standard Actions artifact \`app-debug-apk\` is also stored and available as a backup.
EOF
          else
            echo "::warning::GitHub Release publishing failed, but the APK build succeeded!"
            echo "The APK build succeeded."
            echo "The Actions artifact named 'app-debug-apk' remains available."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
## ⚠️ Release Publishing Warning

GitHub Release publishing encountered an issue, but the **APK build succeeded**!
- The Actions artifact named **\`app-debug-apk\`** remains fully available.
- You can download the APK from the Artifacts section of this GitHub Actions run summary.
EOF
          fi
